<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global CX Priority Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: project-management workspace. Compact header with bucket counts, sticky view tabs + filters, then List / Board / Timeline views; a side drawer edits one topic. Spectralink 2020 brand palette. */
:root{
  --bg:#F5F5F4; --surface:#FFFFFF; --sunk:#EFEFED; --line:#E2E1DF; --line-strong:#C8C7C4;
  --fg:#36373A; --muted:#6D6E71;
  --accent:#F47B20; --accent-ink:#B4500A; --accent-soft:#FEEFE3;
  --blue:#00AEEF; --blue-ink:#00539A; --blue-soft:#E3F5FD;
  --green:#038C6E; --green-ink:#03785E; --green-soft:#E2F3EF;
  --purple-ink:#762891; --purple-soft:#F1E7F5;
  --teal-ink:#1A7F8E; --teal-soft:#E2F4F6;
  --rust-ink:#B42D1E; --rust-soft:#FBE8E5;
  --park:#8A8B8E; --park-soft:#ECECEB;
  --on-accent:#FFFFFF;
  --scrim:rgba(30,30,34,.35);
  --shadow:0 1px 2px rgba(40,40,45,.06),0 4px 14px rgba(40,40,45,.06);
  --shadow-lg:0 10px 40px rgba(30,30,35,.18);
  --f-display:"Titillium Web","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161719; --surface:#1F2023; --sunk:#27282C; --line:#323438; --line-strong:#4A4C51;
  --fg:#ECECEA; --muted:#A4A5A8;
  --accent:#F68A3A; --accent-ink:#FFA05C; --accent-soft:#3A2516;
  --blue:#2BBEF2; --blue-ink:#6CC4F2; --blue-soft:#15293A;
  --green:#2FB892; --green-ink:#4CCBA8; --green-soft:#14302A;
  --purple-ink:#C99BE0; --purple-soft:#2D1F36;
  --teal-ink:#6FD0DC; --teal-soft:#143034;
  --rust-ink:#F38C7E; --rust-soft:#3A1C18;
  --park:#8E9094; --park-soft:#2A2B2E;
  --on-accent:#1A1006;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161719; --surface:#1F2023; --sunk:#27282C; --line:#323438; --line-strong:#4A4C51;
  --fg:#ECECEA; --muted:#A4A5A8;
  --accent:#F68A3A; --accent-ink:#FFA05C; --accent-soft:#3A2516;
  --blue:#2BBEF2; --blue-ink:#6CC4F2; --blue-soft:#15293A;
  --green:#2FB892; --green-ink:#4CCBA8; --green-soft:#14302A;
  --purple-ink:#C99BE0; --purple-soft:#2D1F36;
  --teal-ink:#6FD0DC; --teal-soft:#143034;
  --rust-ink:#F38C7E; --rust-soft:#3A1C18;
  --park:#8E9094; --park-soft:#2A2B2E;
  --on-accent:#1A1006;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.5 var(--f-body)}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* bucket + area colour roles */
.b-now{--b:var(--accent);--b-ink:var(--accent-ink);--b-soft:var(--accent-soft)}
.b-next{--b:var(--blue);--b-ink:var(--blue-ink);--b-soft:var(--blue-soft)}
.b-later{--b:var(--green);--b-ink:var(--green-ink);--b-soft:var(--green-soft)}
.b-park{--b:var(--park);--b-ink:var(--muted);--b-soft:var(--park-soft)}
.b-unsorted{--b:var(--line-strong);--b-ink:var(--muted);--b-soft:var(--sunk)}
.p-cx{--p-ink:var(--green-ink);--p-soft:var(--green-soft)}
.p-edu{--p-ink:var(--blue-ink);--p-soft:var(--blue-soft)}
.p-svc{--p-ink:var(--accent-ink);--p-soft:var(--accent-soft)}
.p-people{--p-ink:var(--purple-ink);--p-soft:var(--purple-soft)}
.p-tools{--p-ink:var(--teal-ink);--p-soft:var(--teal-soft)}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:22px 18px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.eyebrow{font:600 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
h1{font:300 clamp(28px,4vw,38px)/1.1 var(--f-display);margin:4px 0 0;letter-spacing:-.01em}
h1 b{font-weight:600;color:var(--accent-ink)}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.count{display:flex;flex-direction:column;min-width:74px;padding:6px 12px;border-radius:8px;background:var(--b-soft);border:1px solid transparent}
.count b{font:600 22px/1.1 var(--f-display);color:var(--b-ink);font-variant-numeric:tabular-nums}
.count span{font-size:12.5px;color:var(--muted)}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:0}
.tabs{display:flex;gap:2px;margin-right:auto}
.tab{display:flex;align-items:center;gap:7px;border:0;background:none;padding:13px 12px 11px;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);text-decoration:none;font-size:15px}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:8px}
.search{position:relative;flex:0 1 230px;min-width:150px}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px 6px 30px;font-size:14.5px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sel{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.96)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn.danger{color:var(--rust-ink);border-color:var(--rust-ink)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.status.busy i{background:var(--blue)}
.status.warn{color:var(--rust-ink)} .status.warn i{background:var(--rust-ink)}
.status.local i{background:var(--accent)}
@media (max-width:700px){.counts{width:100%;flex-wrap:nowrap}.count{flex:1;min-width:0;padding:5px 8px}.count span{font-size:12px;white-space:nowrap}.tabs{width:100%;margin-right:0}.tab{flex:1;justify-content:center;padding-inline:6px}.tools{width:100%}.search{flex:1 1 140px}}

.notice{margin-top:16px;padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--fg);font-size:14.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
main .wrap{padding-block:18px 80px}

/* shared bits */
.code{font:500 12px var(--f-mono);color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:5px;padding:1px 7px;background:var(--p-soft,var(--sunk));color:var(--p-ink,var(--muted));white-space:nowrap}
.tag.urgent{background:var(--rust-soft);color:var(--rust-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:6px;padding:3px 9px;font-weight:600;font-size:13.5px;background:var(--b-soft);color:var(--b-ink);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--b)}
button.pill:hover{border-color:var(--b)}
.tf{display:inline-flex;align-items:center;gap:5px;border:1px dashed var(--line-strong);border-radius:6px;padding:3px 9px;font-size:13.5px;color:var(--muted);background:transparent;white-space:nowrap}
.tf.set{border-style:solid;border-color:var(--line);color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.tf:hover{border-color:var(--accent)}
.ctx{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.ctx.has{color:var(--accent-ink);font-weight:600}
.ctxbtn{border:1px solid transparent;background:none;border-radius:6px;padding:3px 8px}
.ctxbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.dates{display:flex;flex-wrap:wrap;gap:8px;margin:0 2px 4px}
.dates label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.dates input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;font-size:14px;min-width:0}
.dates input:focus{border-color:var(--accent);outline:none}
.derr{margin:0 2px;font-size:13px;color:var(--rust-ink)}
.derr:empty{display:none}
.tools-h{font:600 22px var(--f-display);margin:0}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.tooltbl td{vertical-align:top}
.tooltbl .cur{font-size:14px;color:var(--fg)}
.strat{display:flex;gap:6px;align-items:flex-start;margin-top:6px;font-size:13.5px;color:var(--fg);background:var(--accent-soft);border-radius:6px;padding:5px 8px}
.strat svg{flex:none;margin-top:3px;color:var(--accent-ink)}
.sel-tool{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 9px;font-weight:700;font-size:14px;text-align:left}
.sel-tool:hover{border-color:var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:5px}
.linkchip{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 7px;text-align:left}
.linkchip:hover{border-color:var(--accent);color:var(--accent-ink)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}

/* LIST view */
.group{margin-bottom:22px}
.ghead{display:flex;align-items:center;gap:10px;margin:0 0 8px;width:100%;border:0;background:none;padding:4px 0;text-align:left}
.ghead .pill{font-size:14px;padding:4px 11px}
.ghead small{color:var(--muted);font-size:13.5px}
.ghead svg{color:var(--muted);transition:transform .15s}
.ghead[aria-expanded="false"] svg{transform:rotate(-90deg)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:900px;table-layout:fixed}
th{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14.5px}
tr:last-child td{border-bottom:0}
tbody tr{border-left:3px solid var(--b)}
tbody tr:hover td{background:var(--bg)}
.tcell{display:flex;align-items:center;gap:10px;min-width:0}
.tname{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:15px;line-height:1.3;color:var(--fg)}
.tname:hover{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.owner-cell{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner-cell.set{color:var(--fg)}
.when{color:var(--muted);font-size:13px;white-space:nowrap}

/* BOARD view */
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;min-width:0;border-top:3px solid var(--b);min-height:120px}
.col.over{outline:2px dashed var(--b);outline-offset:-2px}
.col h2{display:flex;align-items:center;gap:8px;font:600 16px var(--f-display);margin:0 0 10px;color:var(--b-ink)}
.col h2 span{font:600 13px var(--f-body);color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:8px}
.kcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)}
.kcard:hover{border-color:var(--line-strong)}
.kcard[draggable="true"]{cursor:grab}
.kcard.dragging{opacity:.4}
.kcard .t{font-weight:600;font-size:14.5px;line-height:1.3;margin:3px 0 8px}
.kcard .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kcard .o{font-size:13px;color:var(--muted);margin-top:6px}
.board-hint{font-size:13.5px;color:var(--muted);margin:0 0 10px}

/* TIMELINE view */
.tl-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:12px}
.tl-head label{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.tl-head input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}
.legend{display:flex;gap:12px;font-size:13.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--b);vertical-align:-1px}
.gantt-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.gantt{min-width:900px;--lab:300px}
.grow{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);border-bottom:1px solid var(--line);min-height:40px}
.grow:last-child{border-bottom:0}
.glab{padding:7px 12px;display:flex;align-items:center;gap:8px;min-width:0;border-right:1px solid var(--line)}
.glab button{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:14px;line-height:1.25;color:var(--fg);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.glab button:hover{color:var(--accent-ink)}
.gtrack{position:relative}
.gline{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--rust-ink);z-index:2}
.gbar{position:absolute;top:8px;bottom:8px;border-radius:6px;background:var(--b);color:var(--on-accent);border:0;padding:0 8px;font-size:12.5px;font-weight:600;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:1;min-width:6px}
.b-park .gbar,.b-unsorted .gbar{color:#fff}
.gbar:hover{filter:brightness(1.07);box-shadow:var(--shadow)}
.gunset{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:1px dashed var(--line-strong);background:var(--surface);border-radius:6px;padding:2px 9px;font-size:13px;color:var(--muted)}
.gunset:hover{border-color:var(--accent);color:var(--accent-ink)}
.ghdr{position:sticky;top:0;background:var(--surface);z-index:3}
.ghdr .gtrack{height:46px}
.gtick{position:absolute;top:6px;transform:translateX(-50%);font-size:12px;color:var(--muted);text-align:center;line-height:1.25;white-space:nowrap}
.gtick b{display:block;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.gtick.first{transform:none;left:6px!important;text-align:left}
.gtick.last{transform:translateX(-100%)}
.gsec{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);background:var(--b-soft);border-bottom:1px solid var(--line)}
.gsec div{padding:6px 12px;font:600 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--b-ink)}
@media (max-width:700px){.gantt{--lab:170px}}

/* popover */
.pop{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:8px;min-width:200px;max-width:calc(100vw - 32px)}
.pop .opt{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 9px;border-radius:6px;text-align:left;font-weight:600;font-size:14.5px}
.pop .opt:hover,.pop .opt:focus-visible{background:var(--sunk)}
.pop .opt i{width:10px;height:10px;border-radius:50%;background:var(--b)}
.pop .opt small{margin-left:auto;font-weight:400;color:var(--muted);font-size:12.5px}
.pop .opt[aria-checked="true"]{background:var(--b-soft);color:var(--b-ink)}
.pop h4{margin:4px 4px 6px;font:600 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.days{display:flex;flex-wrap:wrap;gap:5px;margin:0 2px 8px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.day:hover{border-color:var(--accent)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day:disabled{opacity:.35;cursor:default}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:61;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;align-items:flex-start;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.dhead h2{font:600 22px/1.25 var(--f-display);margin:4px 0 0;text-wrap:balance}
.dhead .x{margin-left:auto;flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.dbody{overflow-y:auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:20px}
.dsum{margin:0;color:var(--muted)}
.field>label,.field>.lab{display:block;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.seg button i{width:9px;height:9px;border-radius:50%;background:var(--b)}
.seg button[aria-pressed="true"]{background:var(--b);border-color:var(--b);color:var(--on-accent)}
.seg button.b-park[aria-pressed="true"],.seg button.b-unsorted[aria-pressed="true"]{color:#fff}
.seg button[aria-pressed="true"] i{background:currentColor}
.tfrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center}
.tfrow span{font-size:14px;color:var(--muted)}
.tfnote{font-size:13.5px;color:var(--muted);margin-top:6px}
.inp,.ta{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px}
.ta{min-height:88px;resize:vertical;line-height:1.45}
.inp:focus,.ta:focus{border-color:var(--accent);outline:none}
.addrow{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.clist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.clist li{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;background:var(--bg)}
.clist .who{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.clist .who button{margin-left:auto;border:0;background:none;color:var(--muted);font-size:12.5px;padding:0}
.clist .who button:hover{color:var(--rust-ink)}

</div></header>

<nav class="bar" aria-label="Views and filters"><div class="wrap">
  <div class="tabs">
    <a class="tab" href="#list" data-view="list"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>List</a>
    <a class="tab" href="#board" data-view="board"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg>Board</a>
    <a class="tab" href="#timeline" data-view="timeline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 6h9M7 12h11M5 18h7"/></svg>Timeline</a>
    <a class="tab" href="#tools" data-view="tools"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Tools</a>

    <select class="sel" id="area" aria-label="Filter by area"></select>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const BUCKETS={now:{l:"Now",h:"This quarter"},next:{l:"Next",h:"After Now lands"},later:{l:"Later",h:"This year, not now"},park:{l:"Park",h:"Not now, or not ours"},unsorted:{l:"To sort",h:"Not discussed yet"}};
const B_ORDER=["now","next","later","park","unsorted"];
const BOARD_ORDER=["unsorted","now","next","later","park"];
const PLANNED=["now","next","later"];
const STARTS=[0,30,60,90,120,180];
const ENDS=[30,60,90,120,180,210];
const MAXD_MIN=210;
const DEFAULT_TF={now:[0,30],next:[30,90],later:[90,180]};
const PILLARS={cx:"CX Operations",edu:"Education",svc:"Services",people:"People",tools:"Tool stack"};
const TYPES=[["Target","t-target","Target"],["Fact","t-fact","Facts"],["To verify","t-verify","To verify"],["Idea","t-idea","Ideas"]];
const LOCAL_KEY="cx-priority-review.local.v3";

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const B=t=>BUCKETS[t.bucket]?t.bucket:"unsorted";
const num=v=>Number.isFinite(v)?v:null;

/* ---------- state ---------- */
const S={
  mode:"loading",          // loading | db | local | none
  topics:new Map(),        // code -> topic
  context:[],              // {id, code, text, by, byName, at}
  plan:{start:"2026-11-02"},
  canWrite:true, me:{id:null,name:""},
  names:{}, view:"list", q:"", area:"", collapsed:new Set(),
  open:null, openTool:null, tools:new Map(), pending:0, error:""
};
let db=null,user=null,downloads=null;

/* ---------- helpers ---------- */
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400);}
function planDate(days){const [y,m,d]=(S.plan.start||"2026-11-02").split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d+days));return dt;}
const fmtD=dt=>dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"});
const fmtDY=dt=>dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
const isoD=dt=>dt.toISOString().slice(0,10);
/* replace a region only when its markup changed, so a click in progress is never lost */
function setHTML(el,h){if(el&&el._h!==h){el._h=h;el.innerHTML=h;}}
function isoToUTC(iso){const [y,m,d]=String(iso).split("-").map(Number);return new Date(Date.UTC(y,m-1,d));}
const validISO=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"")&&!isNaN(isoToUTC(v));
function dayOf(iso){return Math.round((isoToUTC(iso)-isoToUTC(S.plan.start||"2026-11-02"))/864e5);}
/* effective timeframe in days from plan start: exact dates win over day presets */
function eff(t){if(validISO(t.startDate)&&validISO(t.endDate))return {s:dayOf(t.startDate),e:dayOf(t.endDate),custom:true};const s=num(t.start),e=num(t.end);return {s,e,custom:false};}
function effDates(t){const f=eff(t);if(f.s==null||f.e==null)return null;return f.custom?[isoToUTC(t.startDate),isoToUTC(t.endDate)]:[planDate(f.s),planDate(f.e)];}
function tfLabel(t){const f=eff(t);if(f.s==null||f.e==null)return"";if(f.custom){const d=effDates(t);return `${fmtD(d[0])} – ${fmtD(d[1])}`;}return `Days ${f.s}–${f.e}`;}
function tfDates(t){const d=effDates(t);if(!d)return"";return `${fmtD(d[0])} – ${fmtD(d[1])}`;}
const CLEAR_TF={start:null,end:null,startDate:null,endDate:null};
function presetPatch(t,which,v){const f=eff(t);let s=f.custom?null:f.s,e=f.custom?null:f.e;
  if(which==="s"){s=v;if(e==null||e<=s)e=ENDS.find(x=>x>s);}else{e=v;if(s==null||s>=e)s=[...STARTS].reverse().find(x=>x<e);}
  return {start:s,end:e,startDate:null,endDate:null};}
function dateFields(t,pre){const d=effDates(t),f=eff(t),ro=S.canWrite?"":"disabled";
  return `<div class="dates"><label for="${pre}S">From<input type="date" id="${pre}S" data-date="s" value="${d?isoD(d[0]):""}" ${ro}></label><label for="${pre}E">To<input type="date" id="${pre}E" data-date="e" value="${d?isoD(d[1]):""}" ${d?`min="${isoD(d[0])}"`:""} ${ro}></label></div>
  <p class="derr" id="${pre}Err" role="alert"></p>${f.custom?'<p class="meta-line" style="margin:2px 2px 6px">Using exact dates. Pick a day preset above to switch back.</p>':""}`;}
function applyDates(code,pre){const t=S.topics.get(code),a=$(pre+"S"),b=$(pre+"E"),err=$(pre+"Err");if(!t||!a||!b)return;
  const sv=a.value,ev=b.value;if(err)err.textContent="";
  if(!validISO(sv)||!validISO(ev))return;
  if(isoToUTC(ev)<=isoToUTC(sv)){if(err)err.textContent="The end date has to be after the start date.";return;}
  saveTopic(code,{startDate:sv,endDate:ev,start:null,end:null});toast(`${code}: ${fmtD(isoToUTC(sv))} – ${fmtD(isoToUTC(ev))}`);}
function fmtWhen(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});}
function list(){return [...S.topics.values()];}
function ctxFor(code){return S.context.filter(c=>c.code===code).sort((a,b)=>String(b.at).localeCompare(String(a.at)));}
function matches(t){
  if(t.partOf)return false;
  if(S.area&&t.pillar!==S.area)return false;
  const q=S.q.trim().toLowerCase();if(!q)return true;
  return [t.code,t.title,t.summary,t.owner,t.notes,...(t.details||[]).map(d=>d.text),...ctxFor(t.code).map(c=>c.text)].join(" ").toLowerCase().includes(q);
}
function sortIn(a,b){const x=eff(a),y=eff(b);return (x.s??9999)-(y.s??9999)||(x.e??9999)-(y.e??9999)||(a.order??0)-(b.order??0)||a.code.localeCompare(b.code,undefined,{numeric:true});}
function nameOf(c){if(c.by&&S.names[c.by])return S.names[c.by];return c.byName||"Someone";}

/* ---------- data layer ---------- */
const writeChains={};
function chain(key,fn){S.pending++;drawStatus();const p=(writeChains[key]||Promise.resolve()).then(fn).catch(e=>{S.error=(e&&e.code)||"error";if(e&&e.code==="invalid_argument"){S.canWrite=false;}toast(e&&e.code==="quota_exceeded"?"The store is full. Delete some added context, then try again.":"That change didn't save. Check your connection and try again.");}).finally(()=>{S.pending--;drawStatus();});writeChains[key]=p;return p;}

function stamp(){return {updatedAt:new Date().toISOString(),updatedBy:S.me.id||null};}
function saveTopic(code,patch){
  const t=S.topics.get(code);if(!t)return;
  if(!S.canWrite){toast("You can view this page but not change it.");return;}
  Object.assign(t,patch,stamp());
  render();
  if(S.mode==="db")chain("t:"+code,()=>db.doc("topics/"+code).update({...patch,...stamp()}));
  else saveLocal();
}
function addContext(code,text){
  if(!S.canWrite){toast("You can view this page but not change it.");return;}
  const entry={code,text,by:S.me.id||null,byName:S.me.name||"",at:new Date().toISOString()};
  if(S.mode==="db"){
    const ref=db.collection("context").doc();
    S.context.push({id:ref.id,...entry});render();
    chain("c:"+ref.id,()=>ref.set(entry));
    chain("t:"+code,()=>db.doc("topics/"+code).update(stamp()));
  }else{S.context.push({id:"l"+Date.now()+Math.random().toString(36).slice(2,6),...entry});const t=S.topics.get(code);if(t)Object.assign(t,stamp());saveLocal();render();}
  toast("Context added");
}
function deleteContext(id){
  S.context=S.context.filter(c=>c.id!==id);render();
  if(S.mode==="db")chain("c:"+id,()=>db.doc("context/"+id).delete());else saveLocal();
}
const TOOL_STATUS={open:{l:"Not started",c:"b-unsorted"},eval:{l:"Evaluating",c:"b-next"},decided:{l:"Decided",c:"b-now"},live:{l:"In place",c:"b-later"}};
const TS_ORDER=["open","eval","decided","live"];
function normTool(x,id){return {id:x.id||id,name:x.name||"New tool",need:x.need||"",current:x.current||"",links:Array.isArray(x.links)?x.links:[],strategy:x.strategy||"",selected:x.selected||"",owner:x.owner||"",status:TOOL_STATUS[x.status]?x.status:"open",order:num(x.order)??999,updatedAt:x.updatedAt||"",updatedBy:x.updatedBy||null};}
function toolList(){return [...S.tools.values()].sort((a,b)=>a.order-b.order||a.name.localeCompare(b.name));}
function saveTool(id,patch){
  const x=S.tools.get(id);if(!x)return;
  if(!S.canWrite){toast("You can view this page but not change it.");return;}
  Object.assign(x,patch,stamp());render();
  if(S.mode==="db")chain("tool:"+id,()=>db.doc("tools/"+id).update({...patch,...stamp()}));else saveLocal();
}
function addTool(){
  if(!S.canWrite){toast("You can view this page but not change it.");return;}
  const order=Math.max(-1,...toolList().map(x=>x.order))+1;
  const id=S.mode==="db"?db.collection("tools").doc().id:"tool-"+Date.now().toString(36);
  const x=normTool({id,name:"New tool",order,...stamp()},id);S.tools.set(id,x);
  if(S.mode==="db")chain("tool:"+id,()=>db.doc("tools/"+id).set({...x}));else saveLocal();
  render();openToolDrawer(id,"tName");
}
function deleteTool(id){
  S.tools.delete(id);closeDrawer();render();
  if(S.mode==="db")chain("tool:"+id,()=>db.doc("tools/"+id).delete());else saveLocal();
  toast("Tool removed");
}
function savePlan(start){
  S.plan.start=start;render();
  if(S.mode==="db")chain("plan",()=>db.doc("settings/plan").set({start}));else saveLocal();
}

/* local mode (GitHub Pages or no shared store) */
function fromFile(){return (Array.isArray(window.TOPICS)?window.TOPICS:[]).map((t,i)=>normalize({...t,order:num(t.order)??i}));}
function normalize(t){return {code:String(t.code),title:t.title||"",pillar:t.pillar||"cx",urgent:!!t.urgent,isNew:!!t.isNew,plan:t.plan||"",summary:t.summary||"",details:Array.isArray(t.details)?t.details:[],bucket:BUCKETS[t.bucket]?t.bucket:"unsorted",order:num(t.order)??0,owner:t.owner||"",notes:t.notes||"",start:num(t.start),end:num(t.end),startDate:validISO(t.startDate)?t.startDate:null,endDate:validISO(t.endDate)?t.endDate:null,updatedAt:t.updatedAt||"",updatedBy:t.updatedBy||null,partOf:t.partOf||null};}
function loadLocal(){
  const file=fromFile();let saved=null;
  try{saved=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");}catch(e){}
  const byCode=new Map(file.map(t=>[t.code,t]));
  if(saved&&saved.topics){for(const s of saved.topics){if(byCode.has(s.code))byCode.set(s.code,normalize({...byCode.get(s.code),...s}));}}
  S.topics=byCode;
  S.context=(saved&&Array.isArray(saved.context))?saved.context:[];
  const tools=(saved&&Array.isArray(saved.tools))?saved.tools:(Array.isArray(window.TOOLS)?window.TOOLS:[]);
  S.tools=new Map(tools.map((x,i)=>{const t=normTool({order:i,...x},x.id||("tool-"+i));return [t.id,t];}));
  if(saved&&saved.plan&&saved.plan.start)S.plan.start=saved.plan.start;
  // context saved into topics.js by an earlier "Save to GitHub"
  if(!(saved&&saved.context)){for(const t of (window.TOPICS||[]))if(Array.isArray(t.context))for(const c of t.context)S.context.push({id:"f"+Math.random().toString(36).slice(2),code:String(t.code),...c});}
}
function saveLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify({topics:list().map(t=>({code:t.code,bucket:t.bucket,order:t.order,owner:t.owner,notes:t.notes,start:t.start,end:t.end,startDate:t.startDate,endDate:t.endDate,updatedAt:t.updatedAt})),context:S.context,tools:toolList(),plan:S.plan}));}catch(e){}drawStatus();}

/* shared mode */
async function boot(){
  const use=window.claude&&typeof window.claude.use==="function"?window.claude.use.bind(window.claude):null;
  if(use){
    try{[db,user,downloads]=await Promise.all([use("db"),use("user"),use("downloads")]);}catch(e){db=null;}
  }
  if(db){
    S.mode="db";
    if(user){
      try{const me=await user.me();S.me={id:me.id,name:me.name||""};}catch(e){}
      try{const w=await user.can("data.write");if(w===false)S.canWrite=false;}catch(e){}
    }
    let gotTopics=false;
    const timer=setTimeout(()=>{if(!gotTopics){S.error="slow";drawStatus();showNotice("The saved priorities can't be reached yet. They'll appear as soon as the connection comes back.");}},10000);
    db.collection("topics").onSnapshot(snap=>{
      const m=new Map();snap.docs.forEach(d=>{const t=normalize({...d.data(),code:d.data().code||d.id});m.set(t.code,t);});
      // keep this tab's unsaved typing
      S.topics=m;
      if(!snap.metadata.fromCache){gotTopics=true;clearTimeout(timer);if(S.error==="slow"){S.error="";hideNotice();}}
      render();
    },e=>{clearTimeout(timer);S.error=e.code;drawStatus();showNotice("The saved priorities stopped updating. Reload the page to reconnect.");});
    db.collection("context").onSnapshot(snap=>{S.context=snap.docs.map(d=>({id:d.id,...d.data()}));resolveNames();render();},()=>{});
    db.collection("tools").onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>m.set(d.id,normTool(d.data(),d.id)));S.tools=m;render();},()=>{});
    db.doc("settings/plan").onSnapshot(snap=>{if(snap.exists&&snap.data().start){S.plan.start=snap.data().start;render();}},()=>{});
  }else{
    S.mode=(window.TOPICS&&window.TOPICS.length)?"local":"none";
    if(S.mode==="local"){loadLocal();showNotice(`Changes on this copy are saved in this browser only. <button class="btn" type="button" id="ghBtn">Save to GitHub</button>`);}
    else showNotice("No topics found. Sign in to claude.ai to open the shared version, or make sure data/topics.js sits next to this page.");
  }
  render();
}
async function resolveNames(){
  if(!user)return;const ids=[...new Set(S.context.map(c=>c.by).filter(Boolean))].filter(id=>!(id in S.names));if(!ids.length)return;
  try{const ps=await user.profiles(ids);let changed=false;for(const id of ids){if(ps[id]&&ps[id].name){S.names[id]=ps[id].name;changed=true;}else S.names[id]="";}if(changed&&S.open)drawDrawer();}catch(e){}
}
function showNotice(html){const n=$("notice");n.innerHTML=html;n.hidden=false;const gb=$("ghBtn");if(gb)gb.onclick=openGitHub;}
function hideNotice(){$("notice").hidden=true;}

/* ---------- render ---------- */
function drawStatus(){
  const s=$("status"),t=s.lastElementChild;s.className="status";
  if(S.mode==="loading"){t.textContent="Loading…";s.classList.add("busy");}
  else if(S.mode==="local"){t.textContent="Saved in this browser";s.classList.add("local");}
  else if(S.mode==="none"){t.textContent="No data";s.classList.add("warn");}
  else if(!S.canWrite){t.textContent="View only";s.classList.add("warn");}
  else if(S.pending>0){t.textContent="Saving…";s.classList.add("busy");}
  else if(S.error==="slow"){t.textContent="Can't reach saved data";s.classList.add("warn");}
  else if(S.error&&S.error!=="slow"){t.textContent="Last change didn't save";s.classList.add("warn");}
  else{t.textContent="All changes saved for everyone";}
}
function drawCounts(){
  const c={now:0,next:0,later:0,park:0,unsorted:0};list().filter(t=>!t.partOf).forEach(t=>c[B(t)]++);
  $("counts").innerHTML=B_ORDER.map(k=>`<div class="count b-${k}"><b>${c[k]}</b><span>${BUCKETS[k].l}</span></div>`).join("");
}
function drawArea(){
  const sel=$("area");if(sel.options.length)return;
  sel.innerHTML=`<option value="">All areas</option>`+Object.entries(PILLARS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
}
const chev='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const icCal='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
const icNote='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

function bucketPill(t,asBtn=true){const k=B(t);const inner=`<i></i>${BUCKETS[k].l}`;return asBtn?`<button type="button" class="pill b-${k}" data-act="bucket-menu" data-code="${esc(t.code)}" aria-haspopup="true" title="Change bucket">${inner}</button>`:`<span class="pill b-${k}">${inner}</span>`;}

function drawList(){

  if(!S.topics.size){el.innerHTML=S.mode==="loading"?`<div class="empty">Loading the priorities…</div>`:`<div class="empty">No topics yet.</div>`;return;}
  if(!vis.length){el.innerHTML=`<div class="empty">No topics match your search. <button class="btn" type="button" data-act="clear">Clear filters</button></div>`;return;}
  el.innerHTML=B_ORDER.map(k=>{
    const rows=vis.filter(t=>B(t)===k).sort(sortIn);if(!rows.length)return"";
    const col=S.collapsed.has(k);
    return `<div class="group b-${k}">
      <button type="button" class="ghead" data-act="collapse" data-b="${k}" aria-expanded="${!col}">${chev}<span class="pill b-${k}"><i></i>${BUCKETS[k].l}</span><small>${rows.length} · ${BUCKETS[k].h}</small></button>
      ${col?"":`<div class="tbl-wrap"><table><thead><tr><th>Topic</th><th style="width:130px">Bucket</th><th style="width:160px">Timeframe</th><th style="width:150px">Owner</th><th style="width:90px" title="Added context and decision notes">Context</th><th style="width:120px">Updated</th></tr></thead><tbody>

        <td>${bucketPill(t)}</td>

function drawTimeline(){
  const el=$("v-timeline"),vis=list().filter(matches).filter(t=>PLANNED.includes(B(t)));
  const lastEnd=Math.max(0,...vis.map(t=>eff(t).e).filter(x=>x!=null));
  const MAXD=Math.max(MAXD_MIN,Math.ceil(lastEnd/30)*30);
  const ticks=[0,...ENDS];if(MAXD>210)for(let x=240;x<=MAXD;x+=30)ticks.push(x);
  const pct=d=>(d/MAXD*100).toFixed(3)+"%";
  const today=new Date();const [y,m,d]=(S.plan.start).split("-").map(Number);
  const todayDays=(Date.UTC(today.getFullYear(),today.getMonth(),today.getDate())-Date.UTC(y,m-1,d))/864e5;
  const lines=ticks.map(x=>`<span class="gline" style="left:${pct(x)}"></span>`).join("")+(todayDays>=0&&todayDays<=MAXD?`<span class="gtoday" style="left:${pct(todayDays)}" title="Today"></span>`:"");
  const head=`<div class="grow ghdr"><div class="glab"><span class="meta-line">Topic</span></div><div class="gtrack">${ticks.map((x,i)=>`<span class="gtick ${i===0?"first":i===ticks.length-1?"last":""}" style="left:${pct(x)}"><b>Day ${x}</b>${fmtD(planDate(x))}</span>`).join("")}</div></div>`;
  let body="";
  for(const k of PLANNED){
    const rows=vis.filter(t=>B(t)===k).sort(sortIn);if(!rows.length)continue;
    body+=`<div class="gsec b-${k}"><div>${BUCKETS[k].l} · ${rows.length}</div><div></div></div>`;
    body+=rows.map(t=>{const f=eff(t);const e=f.e,s=f.s==null?null:Math.max(0,f.s);const set=s!=null&&e!=null&&e>s;
      return `<div class="grow b-${k}"><div class="glab"><span class="code">${esc(t.code)}</span><button type="button" data-act="open" data-code="${esc(t.code)}" title="${esc(t.title)}">${esc(t.title)}</button></div>
      <div class="gtrack">${lines}${set?`<button type="button" class="gbar" style="left:${pct(s)};width:${pct(e-s)}" data-act="tf-menu" data-code="${esc(t.code)}" title="${esc(t.title)}: ${esc(tfLabel(t))}, ${esc(tfDates(t))}">${esc(tfLabel(t))}${t.owner?" · "+esc(t.owner):""}</button>`:`<button type="button" class="gunset" data-act="tf-menu" data-code="${esc(t.code)}">Set timeframe</button>`}</div></div>`;}).join("");
  }
  el.innerHTML=`<div class="tl-head"><label for="planStart">Plan starts on <input type="date" id="planStart" value="${esc(S.plan.start)}" ${S.canWrite?"":"disabled"}></label>
    <div class="legend">${PLANNED.map(k=>`<span class="b-${k}"><i></i>${BUCKETS[k].l}</span>`).join("")}<span><i style="background:var(--rust-ink);width:3px"></i>Today</span></div></div>
    ${body?`<div class="gantt-wrap"><div class="gantt">${head}${body}</div></div>`:`<div class="empty">Nothing planned yet. Put topics in Now, Next or Later, and they'll appear here with their timeframe.</div>`}`;
}

      <td class="owner-cell ${x.owner?"set":""}">${x.owner?esc(x.owner):"—"}</td>

    </tr>`).join("")}</tbody></table></div>`:`<div class="empty">No tools match your search.</div>`):`<div class="empty">${S.mode==="loading"?"Loading the tool list…":"No tools listed yet. Click Add a tool to start the list."}</div>`}`;

function drawView(){
  for(const v of ["list","board","timeline","tools"])$("v-"+v).hidden=v!==S.view;
  document.querySelectorAll(".tab").forEach(a=>{if(a.dataset.view===S.view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  if(S.view==="list")drawList();else if(S.view==="board")drawBoard();else if(S.view==="tools")drawTools();else drawTimeline();
}
function render(){drawStatus();drawCounts();drawArea();drawView();if(S.open)drawDrawer();else if(S.openTool)drawToolDrawer();if(popState)repaintPop();}

/* ---------- popover menus ---------- */
const pop=$("pop");let popState=null;
function openPop(kind,code,anchor){popState={kind,code,anchor};repaintPop();place(anchor);const f=pop.querySelector("button:not(:disabled)");if(f)f.focus();}
function closePop(){if(!popState)return;const a=popState.anchor;popState=null;pop.hidden=true;if(a&&a.isConnected)a.focus();}
function place(anchor){
  pop.hidden=false;const r=anchor.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  let left=r.left+scrollX,top=r.bottom+scrollY+6;
  left=Math.min(left,scrollX+document.documentElement.clientWidth-pw-12);left=Math.max(scrollX+12,left);
  if(r.bottom+ph+12>innerHeight&&r.top>ph+12)top=r.top+scrollY-ph-6;
  pop.style.left=left+"px";pop.style.top=top+"px";
}
function repaintPop(){
  const t=S.topics.get(popState.code);if(!t){closePop();return;}
  if(popState.kind==="bucket"){
    pop.setAttribute("aria-label","Bucket");
    pop.innerHTML=`<div role="menu">${B_ORDER.map(k=>`<button type="button" role="menuitemradio" class="opt b-${k}" aria-checked="${B(t)===k}" data-pick-b="${k}"><i></i>${BUCKETS[k].l}<small>${BUCKETS[k].h}</small></button>`).join("")}</div>`;
  }else{
    const f=eff(t),s=f.custom?null:f.s,e=f.custom?null:f.e;
    pop.setAttribute("aria-label","Timeframe");
    pop.innerHTML=`<h4>Start</h4><div class="days">${STARTS.map(x=>`<button type="button" class="day" data-pick-s="${x}" aria-pressed="${s===x}">Day ${x}</button>`).join("")}</div>
      <h4>Finish by</h4><div class="days">${ENDS.map(x=>`<button type="button" class="day" data-pick-e="${x}" aria-pressed="${e===x}" ${s!=null&&x<=s?"disabled":""}>${x} days</button>`).join("")}</div>
      <h4>Or exact dates</h4>${dateFields(t,"pd")}<div class="meta-line" style="margin:0 4px 8px">${tfLabel(t)?esc(tfDates(t)):"Pick a start and a finish, or exact dates."}</div>
      <div style="display:flex;justify-content:space-between;gap:8px"><button type="button" class="btn ghost" data-pick-clear="1">Clear</button><button type="button" class="btn" data-pick-done="1">Done</button></div>`;
  }
}
pop.addEventListener("change",e=>{if(e.target.dataset.date&&popState)applyDates(popState.code,"pd");});
pop.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||!popState)return;const code=popState.code,t=S.topics.get(code);
  if(b.dataset.pickB){setBucket(code,b.dataset.pickB);closePop();return;}
  if(b.dataset.pickS!=null){saveTopic(code,presetPatch(t,"s",+b.dataset.pickS));return;}
  if(b.dataset.pickE!=null){saveTopic(code,presetPatch(t,"e",+b.dataset.pickE));return;}
  if(b.dataset.pickClear){saveTopic(code,CLEAR_TF);return;}
  if(b.dataset.pickDone)closePop();
});
document.addEventListener("click",e=>{if(popState&&!pop.contains(e.target)&&!e.target.closest('[data-act="bucket-menu"],[data-act="tf-menu"]'))closePop();},true);
addEventListener("resize",()=>{if(popState)closePop();});

function setBucket(code,k){
  const t=S.topics.get(code);if(!t||B(t)===k)return;
  const inB=list().filter(x=>x!==t&&B(x)===k);
  const patch={bucket:k,order:inB.length?Math.max(...inB.map(x=>x.order??0))+1:0};
  const f0=eff(t);if(DEFAULT_TF[k]&&(f0.s==null||f0.e==null)){patch.start=DEFAULT_TF[k][0];patch.end=DEFAULT_TF[k][1];}
  saveTopic(code,patch);
  toast(`${code} moved to ${BUCKETS[k].l}${patch.start!=null?` · Days ${patch.start}–${patch.end}`:""}`);
}

/* ---------- drawer ---------- */
const drawer=$("drawer"),scrim=$("scrim");let lastFocus=null;
function openDrawer(code){flushTyping();if(!drawer.hidden&&!lastFocus)lastFocus=document.activeElement;else if(drawer.hidden)lastFocus=document.activeElement;S.openTool=null;drawnFor=null;S.open=code;drawer.hidden=false;scrim.hidden=false;drawDrawer(true);}
function closeDrawer(){flushTyping();S.open=null;S.openTool=null;drawnFor=null;drawer.hidden=true;scrim.hidden=true;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
/* The drawer shell (inputs included) is built once per topic; later updates only
   repaint the bucket, timeframe, context list and meta parts, so typing is never lost. */
let drawnFor=null;
function drawDrawer(first){
  const t=S.topics.get(S.open);if(!t){closeDrawer();return;}
  const ro=S.canWrite?"":"disabled";
  if(first||drawnFor!==t.code){
    drawnFor=t.code;
    const groups=TYPES.map(([type,cls,label])=>{const it=(t.details||[]).filter(d=>d.type===type);return it.length?`<div class="dgroup ${cls}"><h4>${label}</h4><ul>${it.map(d=>`<li>${esc(d.text)}</li>`).join("")}</ul></div>`:"";}).join("");
    drawer.innerHTML=`<div class="dhead"><div style="min-width:0">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="code">${esc(t.code)}</span><span class="tag p-${esc(t.pillar)}">${esc(PILLARS[t.pillar]||t.pillar)}</span>${t.urgent?'<span class="tag urgent">Urgent</span>':""}${t.isNew?'<span class="tag">New topic</span>':""}${t.plan?`<span class="tag">Deck plan: ${esc(t.plan)}</span>`:""}</div>
        <h2 id="dTitle">${esc(t.title)}</h2></div>
        <button type="button" class="x" id="dClose" aria-label="Close">✕</button></div>
      <div class="dbody">
        <p class="dsum">${esc(t.summary)}</p>
        ${t.code==="TS"?`<div class="notice" style="margin:0"><span>${S.tools.size} tools · selected tool recorded for ${toolList().filter(x=>x.selected).length}</span><a class="btn" href="#tools" data-act="go-tools">Open the tool list</a></div>`:""}
        <div class="field"><span class="lab">Bucket</span><div class="seg" role="group" aria-label="Bucket" id="dBucket"></div></div>
        <div class="field"><span class="lab">Timeframe</span><div id="dTf"></div></div>
        <div class="field"><label for="dOwner">Owner</label><input class="inp" id="dOwner" placeholder="Who leads this?" autocomplete="off" ${ro}></div>
        <div class="field"><label for="dNotes">Decision notes</label><textarea class="ta" id="dNotes" placeholder="What did you agree? Next step, deadline, who to involve." ${ro}></textarea></div>
        <div class="field"><label for="ctxNew">Add context</label><textarea class="ta" id="ctxNew" placeholder="New facts, answers to the open questions, links, decisions from a meeting. Ctrl+Enter adds it." ${ro}></textarea>
          <div class="addrow"><button type="button" class="btn primary" id="ctxAdd" ${ro}>Add context</button></div>
          <div id="dCtx"></div></div>
        <div class="field"><span class="lab">Discovery notes</span>${groups||'<p class="meta-line">No discovery notes for this topic.</p>'}</div>
        <p class="meta-line" id="dMeta"></p>
      </div>`;
    $("dOwner").value=t.owner||"";$("dNotes").value=t.notes||"";
    if(first)$("dClose").focus();
  }
  const k=B(t),f=eff(t),s=f.custom?null:f.s,e=f.custom?null:f.e,ctx=ctxFor(t.code),dd=effDates(t);
  setHTML($("dBucket"),B_ORDER.map(b=>`<button type="button" class="b-${b}" data-set-b="${b}" aria-pressed="${k===b}" ${ro}><i></i>${BUCKETS[b].l}</button>`).join(""));
  const ae=document.activeElement;if(!(ae&&$("dTf").contains(ae)&&ae.tagName==="INPUT"))setHTML($("dTf"),`<div class="tfrow"><span>Start</span><div class="days" style="margin:0">${STARTS.map(x=>`<button type="button" class="day" data-set-s="${x}" aria-pressed="${s===x}" ${ro}>Day ${x}</button>`).join("")}</div>
      <span>Finish by</span><div class="days" style="margin:0">${ENDS.map(x=>`<button type="button" class="day" data-set-e="${x}" aria-pressed="${e===x}" ${ro||(s!=null&&x<=s?"disabled":"")}>${x} days</button>`).join("")}</div></div>
      <div class="lab" style="margin:12px 0 6px;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Or exact dates</div>${dateFields(t,"dd")}
      <div class="tfnote">${dd?`${esc(tfLabel(t))}: ${esc(fmtDY(dd[0]))} to ${esc(fmtDY(dd[1]))} <button type="button" class="btn ghost" data-set-clear="1" style="padding:2px 6px" ${ro}>Clear</button>`:"Not scheduled. It appears on the timeline once it has a start and finish."}</div>`);
  // only overwrite text fields someone else changed, never the one being typed in
  for(const [id,f] of [["dOwner","owner"],["dNotes","notes"]]){const el=$(id);if(el&&document.activeElement!==el&&!typing[f]&&el.value!==(t[f]||""))el.value=t[f]||"";}
  setHTML($("dCtx"),ctx.length?`<ul class="clist">${ctx.map(c=>`<li><div class="who"><b>${esc(nameOf(c))}</b>${esc(fmtWhen(c.at))}${S.canWrite?`<button type="button" data-del="${esc(c.id)}">Delete</button>`:""}</div><p>${esc(c.text)}</p></li>`).join("")}</ul>`:"");
  $("dMeta").textContent=t.updatedAt?`Last updated ${fmtWhen(t.updatedAt)}`:"";
}
const typing={};
function queueField(field,val){
  const code=S.open||S.openTool,kind=S.open?"topic":"tool";if(typing[field])clearTimeout(typing[field].h);typing[field]={code,kind,val};clearTimeout(typing[field].h);
  typing[field].h=setTimeout(()=>flushField(field),700);
}
function flushField(field){const p=typing[field];if(!p)return;clearTimeout(p.h);delete typing[field];const key=field.replace(/^tool:/,"");if(p.kind==="tool"){const x=S.tools.get(p.code);if(x&&x[key]!==p.val)saveTool(p.code,{[key]:p.val});return;}const t=S.topics.get(p.code);if(t&&t[key]!==p.val)saveTopic(p.code,{[key]:p.val});}
function flushTyping(){Object.keys(typing).forEach(flushField);}

        <div class="field"><label for="tStrategy">Strategy</label><textarea class="ta" id="tStrategy" placeholder="Keep, replace or consolidate? Why? Must-haves, integrations, budget, timeline." style="min-height:120px" ${ro}></textarea></div>
        <div class="field"><span class="lab">Related topics</span><div class="links" id="tLinks"></div></div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><p class="meta-line" id="tMeta" style="margin:0"></p>${S.canWrite?'<button type="button" class="btn ghost" id="tDelete">Remove tool</button>':""}</div>
      </div>`;
    if(first)$("dClose").focus();
  }
  for(const [id,f] of Object.entries(TOOL_FIELDS)){const el=$(id);if(el&&document.activeElement!==el&&!typing["tool:"+f]&&el.value!==(x[f]||""))el.value=x[f]||"";}
  $("dTitle").textContent=x.name;
  setHTML($("tStatus"),TS_ORDER.map(k=>`<button type="button" class="${TOOL_STATUS[k].c}" data-tool-status="${k}" aria-pressed="${x.status===k}" ${ro}><i></i>${TOOL_STATUS[k].l}</button>`).join(""));
  setHTML($("tLinks"),x.links.length?x.links.map(c=>S.topics.has(c)?`<button type="button" class="code linkchip" data-open-topic="${esc(c)}">${esc(c)} · ${esc(S.topics.get(c).title)}</button>`:`<span class="code">${esc(c)}</span>`).join(""):'<span class="meta-line">None</span>');
  $("tMeta").textContent=x.updatedAt?`Last updated ${fmtWhen(x.updatedAt)}`:"";
}
drawer.addEventListener("input",e=>{const f=TOOL_FIELDS[e.target.id];if(f&&S.openTool)queueField("tool:"+f,e.target.value);});
drawer.addEventListener("focusout",e=>{const f=TOOL_FIELDS[e.target.id];if(f)flushField("tool:"+f);});
drawer.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||!S.openTool)return;const id=S.openTool;
  if(b.dataset.toolStatus){saveTool(id,{status:b.dataset.toolStatus});return;}
  if(b.dataset.openTopic){openDrawer(b.dataset.openTopic);return;}
  if(b.id==="tDelete"){if(b.dataset.armed){deleteTool(id);}else{b.dataset.armed="1";b.textContent="Click again to remove";b.classList.add("danger");setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Remove tool";b.classList.remove("danger");}},3000);}}
});
drawer.addEventListener("change",e=>{if(e.target.dataset.date&&S.open)applyDates(S.open,"dd");});
drawer.addEventListener("input",e=>{if(e.target.id==="dOwner")queueField("owner",e.target.value);if(e.target.id==="dNotes")queueField("notes",e.target.value);});
drawer.addEventListener("focusout",e=>{if(e.target.id==="dOwner")flushField("owner");if(e.target.id==="dNotes")flushField("notes");});
drawer.addEventListener("click",e=>{if(e.target.closest('[data-act="go-tools"]'))closeDrawer();});
drawer.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||!S.open)return;const code=S.open,t=S.topics.get(code);
  if(b.id==="dClose"){closeDrawer();return;}
  if(b.dataset.setB){setBucket(code,b.dataset.setB);return;}
  if(b.dataset.setS!=null){saveTopic(code,presetPatch(t,"s",+b.dataset.setS));return;}
  if(b.dataset.setE!=null){saveTopic(code,presetPatch(t,"e",+b.dataset.setE));return;}
  if(b.dataset.setClear){saveTopic(code,CLEAR_TF);return;}
  if(b.id==="ctxAdd"){const ta=$("ctxNew"),v=ta.value.trim();if(!v){ta.focus();return;}ta.value="";addContext(code,v);return;}
  if(b.dataset.del){if(b.dataset.armed){deleteContext(b.dataset.del);toast("Context deleted");}else{b.dataset.armed="1";b.textContent="Click again to delete";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Delete";}},3000);}}
});
scrim.addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(popState){closePop();}else if(S.open)closeDrawer();}
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&e.target.id==="ctxNew"){$("ctxAdd").click();}
});

/* ---------- main events ---------- */
document.querySelector("main").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,code=b.dataset.code;
  if(a==="open")openDrawer(code);
  else if(a==="tool-open")openToolDrawer(b.dataset.tool,b.dataset.focus);
  else if(a==="tool-add")addTool();
  else if(a==="ctx"){openDrawer(code);const ta=$("ctxNew");if(ta){ta.scrollIntoView({block:"center"});ta.focus({preventScroll:true});}}
  else if(a==="bucket-menu"){if(!S.canWrite){toast("You can view this page but not change it.");return;}popState&&popState.anchor===b?closePop():openPop("bucket",code,b);}
  else if(a==="tf-menu"){if(!S.canWrite){openDrawer(code);return;}popState&&popState.anchor===b?closePop():openPop("tf",code,b);}
  else if(a==="collapse"){const k=b.dataset.b;S.collapsed.has(k)?S.collapsed.delete(k):S.collapsed.add(k);drawList();}
  else if(a==="clear"){S.q="";S.area="";$("q").value="";$("area").value="";drawView();}
});
document.querySelector("main").addEventListener("change",e=>{if(e.target.id==="planStart"&&e.target.value)savePlan(e.target.value);});
/* drag and drop on the board */
let dragCode=null;
$("v-board").addEventListener("dragstart",e=>{const c=e.target.closest(".kcard");if(!c)return;dragCode=c.dataset.code;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragCode);}catch(x){}});
$("v-board").addEventListener("dragend",e=>{const c=e.target.closest(".kcard");if(c)c.classList.remove("dragging");document.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over"));dragCode=null;});
$("v-board").addEventListener("dragover",e=>{const col=e.target.closest("[data-drop]");if(!col||!dragCode)return;e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over");});
$("v-board").addEventListener("drop",e=>{const col=e.target.closest("[data-drop]");if(!col||!dragCode)return;e.preventDefault();col.classList.remove("over");setBucket(dragCode,col.dataset.drop);});

$("q").addEventListener("input",e=>{S.q=e.target.value;drawView();});
$("area").addEventListener("change",e=>{S.area=e.target.value;drawView();});
function route(){const h=location.hash.slice(1);S.view=["list","board","timeline","tools"].includes(h)?h:"list";closePop();drawView();}
addEventListener("hashchange",route);

/* ---------- Excel export ---------- */
function localStamp(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function bucketLabel(t){return BUCKETS[B(t)].l;}
async function exportXlsx(){
  if(!window.XLSX){toast("The Excel tool didn't load. Check your connection and reload the page.");return;}
  flushTyping();
  const all=list().sort((a,b)=>B_ORDER.indexOf(B(a))-B_ORDER.indexOf(B(b))||sortIn(a,b));
  const dt=x=>x==null?"":isoD(planDate(x));
  const rows=all.map(t=>{const c=ctxFor(t.code).slice().reverse();return {
    "Code":t.code,"Topic":t.title,"Area":PILLARS[t.pillar]||t.pillar,"Bucket":bucketLabel(t),
    "Timeframe":tfLabel(t),"Start (day)":eff(t).s??"","Finish (day)":eff(t).e??"","Start date":effDates(t)?isoD(effDates(t)[0]):"","Finish date":effDates(t)?isoD(effDates(t)[1]):"",
    "Owner":t.owner,"Urgent":t.urgent?"Yes":"","Decision notes":t.notes,
    "Added context":c.map(x=>`${localStamp(x.at).slice(0,10)} ${nameOf(x)}: ${x.text}`).join("\n"),
    "Context entries":c.length,"Part of":t.partOf||"","Last updated":localStamp(t.updatedAt),"Summary":t.summary};});
  const ctxRows=[];
  for(const t of all)for(const c of ctxFor(t.code).slice().reverse())ctxRows.push({"Code":t.code,"Topic":t.title,"Bucket":bucketLabel(t),"Added on":localStamp(c.at),"Added by":nameOf(c),"Context":c.text});
  const notesRows=all.filter(t=>t.notes).map(t=>({"Code":t.code,"Topic":t.title,"Bucket":bucketLabel(t),"Owner":t.owner,"Decision notes":t.notes}));
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.json_to_sheet(rows);ws1["!cols"]=[8,42,16,10,18,10,10,12,12,16,8,50,60,10,17,70].map(w=>({wch:w}));ws1["!autofilter"]={ref:ws1["!ref"]};
  XLSX.utils.book_append_sheet(wb,ws1,"All priorities");
  const ws2=XLSX.utils.json_to_sheet(ctxRows.length?ctxRows:[{"Code":"","Topic":"No context added yet","Bucket":"","Added on":"","Added by":"","Context":""}]);ws2["!cols"]=[8,42,10,17,20,90].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws2,"Added context");
  const ws3=XLSX.utils.json_to_sheet(notesRows.length?notesRows:[{"Code":"","Topic":"No decision notes yet","Bucket":"","Owner":"","Decision notes":""}]);ws3["!cols"]=[8,42,10,16,90].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws3,"Decision notes");
  const toolRows=toolList().map(x=>({"Tool need":x.name,"What it has to do":x.need,"What we use today":x.current,"Status":TOOL_STATUS[x.status].l,"Selected tool":x.selected,"Owner":x.owner,"Strategy":x.strategy,"Related topics":x.links.join(", "),"Last updated":localStamp(x.updatedAt)}));
  const ws4=XLSX.utils.json_to_sheet(toolRows.length?toolRows:[{"Tool need":"No tools listed yet"}]);ws4["!cols"]=[34,50,50,13,24,16,70,18,17].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws4,"Tool stack");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const filename=`CX priorities ${new Date().toISOString().slice(0,10)}.xlsx`;
  if(downloads){
    try{await downloads.save({filename,data:new Blob([buf])});toast("Excel file saved");}
    catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("A save is already waiting for your answer.");return;}toast("This view can't save files. Open the page in claude.ai to export.");}
  }else{
    const url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  }
}
$("xlsxBtn").addEventListener("click",exportXlsx);

/* ---------- GitHub copy (local mode only) ---------- */
function openGitHub(){
  const sorted=list().sort((a,b)=>B_ORDER.indexOf(B(a))-B_ORDER.indexOf(B(b))||sortIn(a,b));const pos={};
  const out=sorted.map(t=>{const b=B(t);pos[b]=(pos[b]??-1)+1;return {code:t.code,bucket:b,order:pos[b],owner:t.owner,notes:t.notes,start:num(t.start),end:num(t.end),startDate:t.startDate,endDate:t.endDate,partOf:t.partOf||undefined,title:t.title,pillar:t.pillar,urgent:t.urgent,isNew:t.isNew,plan:t.plan,summary:t.summary,details:t.details,context:ctxFor(t.code).map(c=>({text:c.text,byName:nameOf(c),at:c.at}))};});
  const txt=`// CX priority review topics. Paste this over data/topics.js in GitHub.\n//   bucket: "now" | "next" | "later" | "park" | "unsorted"; start/end: days (0-210)\nwindow.TOPICS = ${JSON.stringify(out,null,2)};\n\n// Tool stack: one row per tool need.\nwindow.TOOLS = ${JSON.stringify(toolList(),null,2)};\n`;
  $("ghText").value=txt;$("ghBox").hidden=false;
  navigator.clipboard.writeText(txt).then(()=>{$("ghMsg").textContent="Copied. In GitHub, open data/topics.js, click the pencil, select all, paste and commit.";},()=>{$("ghText").select();$("ghMsg").textContent="Press Ctrl+C to copy the selected text, then paste it over data/topics.js in GitHub.";});
}
$("ghClose").addEventListener("click",()=>{$("ghBox").hidden=true;});

route();render();boot();
})();
</script>
